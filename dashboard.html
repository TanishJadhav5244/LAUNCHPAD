<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LaunchPad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-rocket"></i>
                LaunchPad
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="pitches.html">Pitches</a></li>
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="aboutus.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contactus.html">Contact Us</a></li>
                </ul>
                <div class="auth-buttons">
                    <a href="#" class="btn btn-outline-light" id="logoutBtn">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container container">
        <div id="roleIndicator" class="role-indicator">
            Loading...
        </div>

        <div class="row" id="dashboardContent">
            <div class="col-12">
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap and Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" type="module"></script>
    
    <!-- Dashboard Access Control -->
    <script src="js/dashboard-access.js" type="module"></script>

    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC2C2dq3RwYQeUGGA8MzLgxtudcnL_dKuo",
            authDomain: "launchpad-2ab08.firebaseapp.com",
            projectId: "launchpad-2ab08",
            storageBucket: "launchpad-2ab08.firebasestorage.app",
            messagingSenderId: "974657612108",
            appId: "1:974657612108:web:adbc2eb0183ca5996687e9",
            measurementId: "G-Y3B565L6E0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Function to redirect to appropriate dashboard based on role
        function redirectToDashboard(role) {
            switch(role) {
                case 'startup':
                case 'founder':
                    window.location.href = 'founderdashboard.html';
                    break;
                case 'investor':
                    window.location.href = 'investordashboard.html';
                    break;
                case 'mentor':
                    window.location.href = 'mentordashboard.html';
                    break;
                default:
                    // Stay on general dashboard
                    break;
            }
        }

        // Listen for authentication state changes
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        // Redirect to role-specific dashboard
                        redirectToDashboard(userData.role);
                    } else {
                        // User data not found, show general dashboard
                        document.getElementById('roleIndicator').textContent = 'General Dashboard';
                        document.getElementById('dashboardContent').innerHTML = `
                            <div class="col-12 text-center">
                                <h3>Welcome to LaunchPad!</h3>
                                <p>Please complete your profile setup to access personalized features.</p>
                                <a href="profile.html" class="btn btn-primary">Complete Profile</a>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('Error checking user role:', error);
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // Handle logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        });
    </script>
</body>
</html>
